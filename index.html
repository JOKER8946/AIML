<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automathon 2.0 – n8n Hackathon at MCE, Hassan</title>
<meta name="description" content="A one-day n8n workflow hackathon at MCE, Hassan on 12 November 2026. Teams of 3, three levels, and AI that runs on your own laptop.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--steel:#e4eaee;--card:#f5f8fa;--ink:#16191b;--accent:#8ecdf2;--mute:#454d52;--line:#b4bfc6;--ok:#4be08a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:112px}
body{font:17px/1.55 Barlow,system-ui,sans-serif;color:var(--ink);background:var(--steel)}
h1,h2,h3,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;line-height:.95;letter-spacing:-.005em}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.haz{height:12px;background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,var(--ink) 14px 28px)}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 26px "Barlow Condensed",sans-serif;letter-spacing:.01em}
.brand img{height:42px;width:auto}
.brand span{color:var(--accent)}
.top nav{display:flex;align-items:center;gap:26px;font-weight:500;font-size:16px}
.top nav a{text-decoration:none;color:#d6dbd9}
.top nav a:hover{color:#fff}
.btn{display:inline-block;background:var(--accent);color:var(--ink);font-weight:600;font-size:18px;padding:13px 24px;border:2px solid var(--ink);border-radius:4px;text-decoration:none;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover{transform:none;background:var(--card)}
.top .btn{padding:8px 16px;font-size:16px;border-color:var(--accent);box-shadow:none}
.top .btn:hover{transform:none;background:#fff}

/* enquiry strip (inside sticky header, visible on every scroll position) */
.help{background:var(--accent);color:var(--ink);border-bottom:2px solid var(--ink)}
